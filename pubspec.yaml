  crop_image: ^1.0.17
  cross_file: ^0.3.5
  cupertino_ui: ^1.1.1
  desktop_drop: ^0.8.4
  device_info_plus: ^13.2.0
  web: ^1.1.0
  dynamic_color: ^2.1.0
  emoji_picker_flutter: ^4.5.4
  extended_image: ^10.1.0
  file_picker: ^13.1.0
  file_selector: ^1.1.0
  open_filex: ^4.5.0
  ym_open_file_plus: ^1.0.0
  flutter:
    sdk: flutter
  flutter_callkit_incoming: ^3.1.6
  flutter_foreground_task: ^11.0.3
  flutter_linkify: ^6.0.0
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_new_badger: ^2.0.0
  flutter_advanced_switch: ^3.1.0
  flutter_easyloading: ^3.0.5
  flutter_secure_storage: ^11.2.0
  flutter_shortcuts_new: ^2.0.0
  flutter_vodozemac: ^0.8.1
  flutter_web_auth_2: ^5.1.0
  flutter_webrtc: ^1.6.2+hotfix.3
  geolocator: ^14.1.1
  go_router: ^18.0.2
  handy_window: ^0.4.2
  highlight: ^0.7.0
  html: ^0.15.7
  http: ^1.6.0
  image: ^4.10.1
  image_picker: ^1.2.3
  wechat_assets_picker: ^10.1.3
  intl: 0.20.3
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  latlong2: ^0.10.1
  light_compressor_v2: ^1.9.1
  livekit_client: ^2.12.0
  local_auth: ^3.0.2
  logging: ^1.3.0
  lpinyin: ^2.0.3
  lottie: ^3.6.1
  managed_configurations: ^1.2.0
  material_ui: 1.5.0
  matrix: #^11.0.0
    git:
      url: https://github.com/famedly/matrix-dart-sdk.git
      ref: main
  media_kit: ^1.1.10
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_macos_video: ^1.1.4
  media_kit_libs_windows_video: ^1.0.9
  media_kit_video: ^2.0.1
  mime: ^2.1.0
  mobile_scanner: ^7.4.2
  native_imaging: ^0.5.0
  ogg_caf_converter: ^0.1.4
  package_info_plus: ^10.2.0
  particles_network: ^1.9.5
  pasteboard: ^0.5.0
  path: ^1.9.0
  path_provider: ^2.1.6
  pretty_qr_code: ^3.6.0
  provider: ^6.0.2
  punycode: ^1.0.0
  qr_code_scanner_plus: ^2.3.0
  qr_image: ^1.0.0
  image_gallery_saver_plus: ^4.0.1
  receive_sharing_intent: ^1.8.1
  record: ^7.1.1
  restart_app: ^1.8.3
  scroll_to_index: ^3.0.1
  share_plus: ^13.3.0
  shorebird_code_push: ^2.0.6
  shared_preferences: ^2.5.5
  terminate_restart: ^1.1.0
  slugify: ^2.0.0
  sqflite_common_ffi: ^2.4.3
  swipe_to_action: ^0.3.0
  unifiedpush: ^6.2.0
  unifiedpush_ui: ^0.2.0
  universal_html: ^2.3.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  video_player: ^2.14.0
  video_player_media_kit: ^2.0.0
  wakelock_plus: ^1.8.0
  # 桌面端（macOS/Windows/Linux）窗口位置与尺寸记忆，原为传递依赖，
  # 提升为直接依赖以便在 Dart 侧控制窗口几何信息。
  window_manager: ^0.5.2
  fcm_shared_isolate: ^3.0.0

dev_dependencies:
  dart_code_linter: ^4.4.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  license_checker: ^1.6.2

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/images/chat/
    - assets/images/chat/menu/
    - assets/images/setting/
    - assets/images/common/
    - assets/images/main/
    - assets/images/mine/
    - assets/logo/mini/
    - assets/sounds/
    - assets/vodozemac/0.8.1/
    - shorebird.yaml

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter_launcher_icons:
  image_path: assets/logo/img/logo.png
  android: true
#  adaptive_icon_foreground: assets/logo/img/logo_foreground.png
#  adaptive_icon_background: assets/logo/img/logo_background.png
#  adaptive_icon_monochrome: assets/logo/img/logo_mono.png
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
  windows:
    generate: true
  web:
    generate: true
#    image_path: assets/logo/img/logo_standalone.png
#    background_color: "#FFFFFF"
#    theme_color: "#41a2bc"

# Guidelines for adding a dependency override:
# 1. Don't do it if you can avoid it or fix it upstream in a manageable time
# 2. Always link an (upstream?) issue
# 3. Explain how and when this can be removed (overrides must be temporarily)
dependency_overrides:
