name: fluffychat
description: Chat with your friends.
publish_to: none
# On version bump please also increase:
# 1. The build number (for F-Droid)
# 2. The version in /snap/snapcraft.yaml
version: 1.0.0+3

environment:
  sdk: ">=3.11.1 <4.0.0"

dependencies:
  archive: ^4.3.0
  async: ^2.13.1
  badges: ^4.0.1
  blurhash_dart: ^1.2.1
  chewie: ^1.17.2
